<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
    crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <style>
        body {
            background-color: #000802;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding-top: 48px;
        }

        .app-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-weight: 700;
            margin-bottom: 24px;
        }

        .task-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 480px;
            margin-bottom: 28px;
        }

        #tasku {
            flex: 1;
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }

        #table {
            width: 100%;
            background-color: dark;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        #table th,
        #table td {
            padding: 12px 16px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        #table th {
            background-color: rgba(0, 0, 0, 0.06);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Task manager</h1>

        <div class="task-form">
            <input type="text" id="tasku" placeholder="Enter a new task...">
            <button type="button" id="add-btn" class="btn btn-success">add</button>
        </div>

        <table id="table">
            <thead>
                <tr>
                    <th>description</th>
                    <th>Complete/Incomplete</th>
                    <th>Complete</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
    crossorigin="anonymous"></script>
    <script src="./manager.js" type="module"></script>
    <script src="https://kit.fontawesome.com/bdf5e5b0ea.js" crossorigin="anonymous"></script>
</body>
</html>
